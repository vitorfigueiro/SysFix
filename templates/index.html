<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Equipamentos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Cabeçalho -->
  <header class="bg-slate-900 text-white p-4 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>📦</span> Controle de Equipamentos
      </h1>
      <button onclick="abrirModalEntrada()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition shadow">
        + Nova Entrada
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- Barra de Filtros e Relatórios -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
      
      <!-- Filtro de Registros -->
      <div class="flex items-center gap-2">
        <label for="filtroStatus" class="font-medium text-slate-600">Filtrar por:</label>
        <select id="filtroStatus" onchange="carregarEquipamentos()" class="border border-slate-300 rounded-lg p-2 bg-white text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
          <option value="nao_finalizados_mes">Não Finalizados (Mês Atual)</option>
          <option value="finalizados_mes">Finalizados (Mês Atual)</option>
          <option value="todos">Todos os Registros</option>
        </select>
      </div>

      <!-- Formulário de Relatório Mensal PDF -->
      <form onsubmit="event.preventDefault(); baixarRelatorio();" class="flex items-center gap-2">
        <span class="font-medium text-slate-600">PDF Mensal:</span>
        <input type="number" id="relatorioMes" min="1" max="12" value="9" class="w-16 border border-slate-300 rounded-lg p-2 text-center" title="Mês" required>
        <input type="number" id="relatorioAno" min="2020" max="2030" value="2026" class="w-24 border border-slate-300 rounded-lg p-2 text-center" title="Ano" required>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition shadow flex items-center gap-1">
          📄 Baixar PDF
        </button>
      </form>

    </div>

    <!-- Tabela de Registros do Banco de Dados -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800 text-slate-200 text-sm font-semibold">
              <th class="p-3 text-center">ID</th>
              <th class="p-3">Equipamento</th>
              <th class="p-3">Tombamento</th>
              <th class="p-3">Téc. Coleta</th>
              <th class="p-3">Data Entrada</th>
              <th class="p-3">Origem</th>
              <th class="p-3 text-center">Status</th>
              <th class="p-3 text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-slate-200 text-sm">
            <tr>
              <td colspan="8" class="text-center p-6 text-slate-500">Carregando dados do banco...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- MODAL: Nova Entrada -->
  <div id="modalEntrada" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4">
      <h2 class="text-lg font-bold text-slate-800">Registrar Entrada de Equipamento</h2>
      <form id="formEntrada" onsubmit="event.preventDefault(); salvarEntrada();" class="space-y-3">
        <input type="text" id="equipamento" placeholder="Equipamento (Ex: Notebook Dell)" class="w-full border p-2 rounded-lg" required>
        <input type="text" id="tombamento" placeholder="Tombamento / Nº Série" class="w-full border p-2 rounded-lg" required>
        
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="tecnico_coleta" placeholder="Técnico de Coleta" class="border p-2 rounded-lg" required>
          <input type="date" id="data_coleta" class="border p-2 rounded-lg" required>
        </div>

        <input type="text" id="origem" placeholder="Origem / Setor" class="w-full border p-2 rounded-lg" required>
        
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="os_coleta" placeholder="Nº O.S. Coleta" class="border p-2 rounded-lg">
          <input type="text" id="localizacao" placeholder="Localização / Bancada" class="border p-2 rounded-lg">
        </div>

        <textarea id="problema" placeholder="Descrição do Problema" class="w-full border p-2 rounded-lg h-20"></textarea>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="fecharModais()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Salvar Entrada</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Registrar Saída -->
  <div id="modalSaida" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4">
      <h2 class="text-lg font-bold text-slate-800">Registrar Saída do Equipamento <span id="saidaRegistroId" class="text-blue-600"></span></h2>
      <form id="formSaida" onsubmit="event.preventDefault(); salvarSaida();" class="space-y-3">
        <input type="hidden" id="saida_id">

        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="tecnico_entrega" placeholder="Técnico de Entrega" class="border p-2 rounded-lg" required>
          <input type="date" id="data_entrega" class="border p-2 rounded-lg" required>
        </div>

        <input type="text" id="os_entrega" placeholder="Nº O.S. de Saída" class="w-full border p-2 rounded-lg">

        <div class="grid grid-cols-2 gap-2">
          <select id="status_custo" class="border p-2 rounded-lg bg-white">
            <option value="Sem Custo">Sem Custo</option>
            <option value="Com Custo">Com Custo</option>
          </select>
          <input type="number" step="0.01" id="valor_custo" placeholder="Valor (0,00)" class="border p-2 rounded-lg">
        </div>

        <div class="flex items-center gap-2">
          <label for="laudado" class="text-sm font-medium text-slate-600">Possui Laudo?</label>
          <select id="laudado" class="border p-2 rounded-lg bg-white">
            <option value="Não">Não</option>
            <option value="Sim">Sim</option>
          </select>
        </div>

        <textarea id="resolucao" placeholder="Resolução / Solução do Serviço" class="w-full border p-2 rounded-lg h-20" required></textarea>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="fecharModais()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Confirmar Saída</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LÓGICA JAVASCRIPT / INTEGRAÇÃO COM BACKEND FASTAPI -->
  <script>
    const API_URL = '/api';

    // 1. Buscar registros no PostgreSQL e preencher a tabela
    async function carregarEquipamentos() {
      const filtro = document.getElementById('filtroStatus').value;
      const tabelaCorpo = document.getElementById('tabelaCorpo');

      try {
        const response = await fetch(`${API_URL}/equipamentos?filtro=${filtro}`);
        if (!response.ok) throw new Error('Falha ao buscar dados.');

        const registros = await response.json();
        tabelaCorpo.innerHTML = '';

        if (registros.length === 0) {
          tabelaCorpo.innerHTML = `
            <tr>
              <td colspan="8" class="text-center p-6 text-slate-400">
                Nenhum equipamento encontrado no banco de dados.
              </td>
            </tr>`;
          return;
        }

        registros.forEach(item => {
          const isFinalizado = item.status === 'Finalizado';

          tabelaCorpo.innerHTML += `
            <tr class="hover:bg-slate-50 border-b border-slate-200">
              <td class="p-3 text-center font-mono font-bold">${item.id}</td>
              <td class="p-3 font-medium text-slate-800">${item.equipamento}</td>
              <td class="p-3 text-slate-600">${item.tombamento}</td>
              <td class="p-3 text-slate-600">${item.tecnico_coleta}</td>
              <td class="p-3 text-slate-600">${item.data_coleta || '-'}</td>
              <td class="p-3 text-slate-600">${item.origem}</td>
              <td class="p-3 text-center">
                <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${
                  isFinalizado ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                }">
                  ${item.status || 'Pendente'}
                </span>
              </td>
              <td class="p-3 text-center">
                ${
                  !isFinalizado 
                    ? `<button onclick="abrirModalSaida(${item.id})" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded hover:bg-slate-700 font-medium">Dar Saída</button>`
                    : `<span class="text-xs text-slate-400 font-medium">Concluído</span>`
                }
              </td>
            </tr>
          `;
        });

      } catch (error) {
        console.error('Erro na requisição:', error);
        tabelaCorpo.innerHTML = `
          <tr>
            <td colspan="8" class="text-center p-6 text-red-500 font-medium">
              Erro ao conectar ao servidor.
            </td>
          </tr>`;
      }
    }

    // 2. Salvar Nova Entrada
    async function salvarEntrada() {
      const payload = {
        equipamento: document.getElementById('equipamento').value,
        tombamento: document.getElementById('tombamento').value,
        tecnico_coleta: document.getElementById('tecnico_coleta').value,
        data_coleta: document.getElementById('data_coleta').value,
        origem: document.getElementById('origem').value,
        os_coleta: document.getElementById('os_coleta').value,
        localizacao: document.getElementById('localizacao').value,
        problema: document.getElementById('problema').value
      };

      try {
        const res = await fetch(`${API_URL}/equipamentos/entrada`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          fecharModais();
          document.getElementById('formEntrada').reset();
          carregarEquipamentos();
        } else {
          const erro = await res.json();
          alert('Erro ao salvar entrada: ' + (erro.detail || 'Falha na operação'));
        }
      } catch (err) {
        alert('Erro ao enviar dados para o servidor.');
      }
    }

    // 3. Abrir e Salvar Registros de Saída
    function abrirModalSaida(id) {
      document.getElementById('saida_id').value = id;
      document.getElementById('saidaRegistroId').textContent = `#${id}`;
      document.getElementById('modalSaida').classList.remove('hidden');
      document.getElementById('modalSaida').classList.add('flex');
    }

    async function salvarSaida() {
      const registroId = document.getElementById('saida_id').value;
      const payload = {
        tecnico_entrega: document.getElementById('tecnico_entrega').value,
        data_entrega: document.getElementById('data_entrega').value,
        os_entrega: document.getElementById('os_entrega').value,
        status_custo: document.getElementById('status_custo').value,
        valor_custo: parseFloat(document.getElementById('valor_custo').value) || 0.0,
        laudado: document.getElementById('laudado').value,
        resolucao: document.getElementById('resolucao').value
      };

      try {
        const res = await fetch(`${API_URL}/equipamentos/${registroId}/saida`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          fecharModais();
          document.getElementById('formSaida').reset();
          carregarEquipamentos();
        } else {
          const erro = await res.json();
          alert('Erro ao registrar saída: ' + (erro.detail || 'Falha na operação'));
        }
      } catch (err) {
        alert('Erro ao enviar dados para o servidor.');
      }
    }

    // 4. Baixar Relatório PDF
    async function baixarRelatorio() {
      const mes = parseInt(document.getElementById('relatorioMes').value);
      const ano = parseInt(document.getElementById('relatorioAno').value);

      try {
        const res = await fetch(`${API_URL}/relatorios/mensal`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mes, ano })
        });

        if (res.ok) {
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `relatorio_coletas_${ano}_${String(mes).padStart(2, '0')}.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        } else {
          alert('Erro ao gerar relatório PDF.');
        }
      } catch (err) {
        alert('Erro de comunicação para download do arquivo.');
      }
    }

    // 5. Utilitários das Modais
    function abrirModalEntrada() {
      document.getElementById('modalEntrada').classList.remove('hidden');
      document.getElementById('modalEntrada').classList.add('flex');
    }

    function fecharModais() {
      document.getElementById('modalEntrada').classList.add('hidden');
      document.getElementById('modalEntrada').classList.remove('flex');
      document.getElementById('modalSaida').classList.add('hidden');
      document.getElementById('modalSaida').classList.remove('flex');
    }

    // Carregar dados assim que a página for aberta
    document.addEventListener('DOMContentLoaded', carregarEquipamentos);
  </script>
</body>
</html>
