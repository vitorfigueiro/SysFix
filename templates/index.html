<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SysFix - Gestão de Equipamentos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">SysFix - Controle de Manutenção</h1>
    <button onclick="abrirModalRelatorio()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-semibold text-sm">
      Gerar Relatório PDF
    </button>
  </header>

  <div class="container mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Painel Esquerdo: Lista de Equipamentos -->
    <div class="bg-white p-4 rounded shadow md:col-span-1">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-lg font-bold">Equipamentos</h2>
        <select id="filtroStatus" onchange="carregarLista(this.value)" class="border rounded p-1 text-sm">
          <option value="nao_finalizados">Em Aberto</option>
          <option value="finalizados">Entregues</option>
          <option value="todos">Todos</option>
        </select>
      </div>

      <div id="listaEquipamentos" class="space-y-2 overflow-y-auto max-h-[650px]">
        <p class="text-gray-500 text-sm">Carregando registros...</p>
      </div>
    </div>

    <!-- Painel Direito: Formulários de Entrada e Saída -->
    <div class="bg-white p-6 rounded shadow md:col-span-2 space-y-6">

      <!-- Formulário de Entrada/Edição -->
      <div>
        <h2 class="text-lg font-bold text-blue-900 border-b pb-2 mb-4" id="formEntradaTitulo">Entrada / Dados Gerais do Equipamento</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Equipamento*</label>
            <input type="text" id="ent_equipamento" class="w-full border rounded p-2 text-sm" placeholder="Ex: Notebook Dell Vostro">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Tombamento / Patrimônio*</label>
            <input type="text" id="ent_tombamento" class="w-full border rounded p-2 text-sm" placeholder="Ex: 123456">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Técnico Coleta*</label>
            <input type="text" id="ent_tecnico" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Data Coleta*</label>
            <input type="date" id="ent_data" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Origem / Setor</label>
            <input type="text" id="ent_origem" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">OS Coleta</label>
            <input type="text" id="ent_os" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Localização Atual</label>
            <select id="ent_loc" class="w-full border rounded p-2 text-sm">
              <option value="Bancada TI">Bancada TI</option>
              <option value="Em Teste">Em Teste</option>
              <option value="Aguardando Peça">Aguardando Peça</option>
              <option value="Concluído">Concluído</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Problema Relatado*</label>
            <textarea id="ent_prob" class="w-full border rounded p-2 text-sm h-20" placeholder="Descreva o defeito..."></textarea>
          </div>
        </div>

        <div class="mt-4 flex gap-2">
          <button onclick="salvarEntrada()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-semibold text-sm">
            Salvar / Atualizar Entrada
          </button>
          <button onclick="limparFormularios()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded font-semibold text-sm">
            Novo / Limpar
          </button>
        </div>
      </div>

      <hr>

      <!-- Formulário de Saída / Conclusão -->
      <div>
        <h2 class="text-lg font-bold text-green-900 border-b pb-2 mb-4">Registro de Saída / Devolução</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Técnico Entrega</label>
            <input type="text" id="sai_tec" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">OS Entrega</label>
            <input type="text" id="sai_os" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Data Entrega</label>
            <input type="date" id="sai_data" class="w-full border rounded p-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Laudado</label>
            <select id="sai_laudado" class="w-full border rounded p-2 text-sm">
              <option value="Sim">Sim</option>
              <option value="Não">Não</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Status Custo</label>
            <select id="sai_status_custo" class="w-full border rounded p-2 text-sm">
              <option value="Sem Custo">Sem Custo</option>
              <option value="Com Custo">Com Custo</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Valor Custo (R$)</label>
            <input type="number" step="0.01" id="sai_valor" class="w-full border rounded p-2 text-sm" value="0.00">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Resolução / Serviço Realizado</label>
            <textarea id="sai_resolucao" class="w-full border rounded p-2 text-sm h-20" placeholder="Descreva os reparos feitos..."></textarea>
          </div>
        </div>

        <div class="mt-4 flex justify-between">
          <button onclick="salvarSaida()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-semibold text-sm">
            Registrar Saída (Finalizar)
          </button>

          <button onclick="excluirRegistroAdmin()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-semibold text-sm">
            Excluir Registro
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal para Parâmetros do Relatório -->
  <div id="modalRelatorio" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-lg">
      <h3 class="text-lg font-bold mb-4">Gerar Relatório em PDF</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Mês</label>
          <select id="rel_mes" class="w-full border rounded p-2 text-sm">
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6">Junho</option>
            <option value="7">Julho</option>
            <option value="8">Agosto</option>
            <option value="9" selected>Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Ano</label>
          <input type="number" id="rel_ano" class="w-full border rounded p-2 text-sm" value="2026">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="rel_anonimizar" class="rounded">
          <label for="rel_anonimizar" class="text-sm">Anonimizar dados de técnicos</label>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button onclick="fecharModalRelatorio()" class="bg-gray-300 px-4 py-2 rounded text-sm font-semibold">Cancelar</button>
        <button onclick="baixarRelatorioPDF()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-semibold">Download PDF</button>
      </div>
    </div>
  </div>

  <script>
    // Configuração base da API (detecta Railway ou local automaticamente)
    const API_BASE = window.location.origin.includes('railway.app') 
      ? '/api' 
      : 'https://web-production-04cf6.up.railway.app/api';

    let registroSelecionadoId = null;

    document.addEventListener('DOMContentLoaded', () => {
      carregarLista('nao_finalizados');
      document.getElementById('ent_data').value = new Date().toISOString().split('T')[0];
    });

    async function carregarLista(filtro = 'nao_finalizados') {
      const listaDiv = document.getElementById('listaEquipamentos');
      listaDiv.innerHTML = '<p class="text-gray-500 text-sm">Buscando...</p>';

      try {
        const res = await fetch(`${API_BASE}/equipamentos?status=${filtro}`);
        if (!res.ok) throw new Error("Erro na requisição");

        const itens = await res.json();
        listaDiv.innerHTML = '';

        if (itens.length === 0) {
          listaDiv.innerHTML = '<p class="text-gray-400 text-sm">Nenhum registro encontrado.</p>';
          return;
        }

        itens.forEach(item => {
          const card = document.createElement('div');
          card.className = `p-3 rounded border cursor-pointer hover:bg-blue-50 transition ${registroSelecionadoId === item.id ? 'border-blue-600 bg-blue-50' : 'border-gray-200'}`;
          card.onclick = () => selecionarItem(item);

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <span class="font-bold text-sm text-gray-800">${item.equipamento}</span>
              <span class="text-xs px-2 py-0.5 rounded ${item.status === 'Entregue' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${item.status || 'Em Manutenção'}</span>
            </div>
            <p class="text-xs text-gray-500 mt-1">Tombamento: ${item.tombamento} | OS: ${item.os_coleta || 'N/A'}</p>
            <p class="text-xs text-gray-600">Técnico: ${item.tecnico}</p>
          `;
          listaDiv.appendChild(card);
        });
      } catch (e) {
        listaDiv.innerHTML = '<p class="text-red-500 text-sm">Falha ao carregar lista de equipamentos.</p>';
      }
    }

    function selecionarItem(item) {
      registroSelecionadoId = item.id;
      document.getElementById('formEntradaTitulo').innerText = `Editando Equipamento #${item.id}`;

      // Preenche Entrada
      document.getElementById('ent_equipamento').value = item.equipamento || '';
      document.getElementById('ent_tombamento').value = item.tombamento || '';
      document.getElementById('ent_tecnico').value = item.tecnico || '';
      document.getElementById('ent_data').value = item.data_coleta || '';
      document.getElementById('ent_origem').value = item.origem || '';
      document.getElementById('ent_os').value = item.os_coleta || '';
      document.getElementById('ent_loc').value = item.localizacao || 'Bancada TI';
      document.getElementById('ent_prob').value = item.problema || '';

      // Preenche Saída se já existir
      document.getElementById('sai_tec').value = item.tecnico_entrega || '';
      document.getElementById('sai_os').value = item.os_entrega || '';
      document.getElementById('sai_data').value = item.data_entrega || '';
      document.getElementById('sai_laudado').value = item.laudado || 'Sim';
      document.getElementById('sai_status_custo').value = item.status_custo || 'Sem Custo';
      document.getElementById('sai_valor').value = item.valor_custo || 0;
      document.getElementById('sai_resolucao').value = item.resolucao || '';
    }

    function limparFormularios() {
      registroSelecionadoId = null;
      document.getElementById('formEntradaTitulo').innerText = 'Entrada / Dados Gerais do Equipamento';

      document.querySelectorAll('input, textarea').forEach(input => {
        if (input.type !== 'checkbox' && input.id !== 'rel_ano') input.value = '';
      });

      document.getElementById('ent_data').value = new Date().toISOString().split('T')[0];
      document.getElementById('sai_valor').value = '0.00';
    }

    async function salvarEntrada() {
      const payload = {
        equipamento: document.getElementById('ent_equipamento').value.trim(),
        tombamento: document.getElementById('ent_tombamento').value.trim(),
        tecnico: document.getElementById('ent_tecnico').value.trim(),
        data_coleta: document.getElementById('ent_data').value,
        origem: document.getElementById('ent_origem').value.trim(),
        os_coleta: document.getElementById('ent_os').value.trim(),
        localizacao: document.getElementById('ent_loc').value,
        problema: document.getElementById('ent_prob').value.trim()
      };

      if (!payload.equipamento || !payload.tombamento || !payload.tecnico || !payload.data_coleta || !payload.problema) {
        return alert("Por favor, preencha todos os campos obrigatórios (*)");
      }

      const url = registroSelecionadoId ? `${API_BASE}/equipamentos/${registroSelecionadoId}` : `${API_BASE}/equipamentos`;
      const method = registroSelecionadoId ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert(registroSelecionadoId ? "Registro atualizado!" : "Equipamento cadastrado com sucesso!");
          limparFormularios();
          carregarLista(document.getElementById('filtroStatus').value);
        } else {
          const err = await res.json();
          alert("Erro: " + (err.detail || "Falha ao salvar"));
        }
      } catch (e) {
        alert("Erro ao se comunicar com o servidor.");
      }
    }

    async function salvarSaida() {
      if (!registroSelecionadoId) return alert("Selecione um equipamento da lista para registrar a saída!");

      const payload = {
        tecnico_entrega: document.getElementById('sai_tec').value.trim(),
        os_entrega: document.getElementById('sai_os').value.trim(),
        data_entrega: document.getElementById('sai_data').value,
        laudado: document.getElementById('sai_laudado').value,
        status_custo: document.getElementById('sai_status_custo').value,
        valor_custo: parseFloat(document.getElementById('sai_valor').value) || 0,
        resolucao: document.getElementById('sai_resolucao').value.trim(),
        status: "Entregue"
      };

      try {
        const res = await fetch(`${API_BASE}/equipamentos/${registroSelecionadoId}/saida`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert("Saída registrada com sucesso!");
          limparFormularios();
          carregarLista(document.getElementById('filtroStatus').value);
        } else {
          const err = await res.json();
          alert("Erro: " + (err.detail || "Falha ao dar saída"));
        }
      } catch (e) {
        alert("Erro ao se comunicar com o servidor.");
      }
    }

    async function excluirRegistroAdmin() {
      if (!registroSelecionadoId) return alert("Selecione um registro para excluir!");

      if (!confirm(`Tem certeza que deseja excluir o registro #${registroSelecionadoId}?`)) return;

      try {
        const res = await fetch(`${API_BASE}/equipamentos/${registroSelecionadoId}`, { method: 'DELETE' });

        if (res.ok) {
          alert("Registro excluído com sucesso!");
          limparFormularios();
          carregarLista(document.getElementById('filtroStatus').value);
        } else {
          const err = await res.json();
          alert("Erro: " + (err.detail || "Falha ao excluir registro"));
        }
      } catch (e) {
        alert("Erro ao se comunicar com o servidor.");
      }
    }

    function abrirModalRelatorio() {
      document.getElementById('modalRelatorio').classList.remove('hidden');
    }

    function fecharModalRelatorio() {
      document.getElementById('modalRelatorio').classList.add('hidden');
    }

    function baixarRelatorioPDF() {
      const mes = document.getElementById('rel_mes').value;
      const ano = document.getElementById('rel_ano').value;
      const anonimizar = document.getElementById('rel_anonimizar').checked;

      window.open(`${API_BASE}/relatorio/pdf?mes=${mes}&ano=${ano}&anonimizar=${anonimizar}`, '_blank');
      fecharModalRelatorio();
    }
  </script>
</body>
</html>
